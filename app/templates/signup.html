{% extends "base.html" %}
{% block title %}2WINS Eats 新規登録{% endblock %}
{% block body %}
<div class="split">
  <div class="split-left">
    <div>
      <div class="split-brand">2WINS Eats</div>
      <div class="split-tagline">登録は1分。社用メールアドレスだけで始められます。</div>
    </div>
    <img class="split-hero" src="/static/img/scooter.jpg" alt="配達のスクーター">
    <div class="split-note">社内輪講ハンズオン用アプリ・本物の決済は行いません</div>
  </div>
  <div class="split-right">
    <form class="form" method="post" action="/signup">
      <div>
        <div class="form-title">新規登録</div>
        <div class="form-lead">@2wins.ai のメールアドレスが必要です</div>
      </div>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <div class="field"><label for="name">名前</label><input class="input" id="name" name="name" type="text" placeholder="例：金 賢佑" value="{{ form.name or '' }}"></div>
      <div class="field"><label for="email">メールアドレス</label><input class="input" id="email" name="email" type="email" placeholder="name@2wins.ai" value="{{ form.email or '' }}"></div>
      <div class="field"><label for="password">パスワード</label><input class="input" id="password" name="password" type="password" placeholder="8文字以上・英字と数字を含む" autocomplete="new-password"></div>
      <div class="field"><label for="password2">パスワード（確認）</label><input class="input" id="password2" name="password2" type="password" placeholder="もう一度入力" autocomplete="new-password"></div>
      <label class="check"><input type="checkbox" name="agree" value="true"><span><a class="link-inline" href="#" onclick="return false">利用規約</a>と<a class="link-inline" href="#" onclick="return false">プライバシーポリシー</a>に同意する</span></label>
      <button class="btn btn-primary" type="submit">登録する</button>
      <div class="form-foot">すでにアカウントをお持ちの方 <a class="link" href="/login">ログイン</a></div>
    </form>
  </div>
</div>
{% endblock %}
