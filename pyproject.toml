[project]
name = "twins-eats"
version = "0.1.0"
description = "2WINS Eats: 社内輪講ハンズオン用の架空の出前注文アプリ"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
dev = "app.cli:dev"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
